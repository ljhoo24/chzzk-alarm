<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방송 기록 · 통계</title>
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <main class="viz-root">
    <header class="top">
      <h1>방송 기록 · 통계</h1>
      <div class="filters">
        <label>채널
          <select id="f-channel"></select>
        </label>
        <label>기간
          <select id="f-period">
            <option value="30">최근 30일</option>
            <option value="90" selected>최근 90일</option>
            <option value="365">최근 1년</option>
            <option value="0">전체</option>
          </select>
        </label>
      </div>
    </header>

    <p class="note">크롬이 켜져 있는 동안 관측한 방송을 기록합니다. 크롬이 꺼져 있던 동안의 방송은 다음 조회 때 마지막 방송 1건만 보충되며, 시청자 수는 관측한 방송에만 있습니다.</p>

    <section class="tiles" id="tiles"></section>

    <div id="empty" class="empty" hidden>이 조건에 해당하는 방송 기록이 없습니다.</div>

    <div id="charts">
      <section class="card">
        <h2>언제 방송을 시작하나</h2>
        <p class="sub">요일·시간대별 방송 시작 횟수</p>
        <div class="chart" id="c-heatmap"></div>
      </section>

      <section class="card">
        <h2>주별 방송 시간</h2>
        <p class="sub">최근 12주, 방송 시작 주 기준(시간)</p>
        <div class="chart" id="c-weekly"></div>
      </section>

      <div class="grid2">
        <section class="card">
          <h2>카테고리별 방송 시간</h2>
          <p class="sub">한 방송에 카테고리가 여럿이면 균등 분배(시간)</p>
          <div class="chart" id="c-category"></div>
        </section>
        <section class="card">
          <h2>방송별 최고 시청자</h2>
          <p class="sub">관측한 최근 30회 방송</p>
          <div class="chart" id="c-viewers"></div>
        </section>
      </div>

      <section class="card">
        <h2>방송 목록</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>시작</th><th>채널</th><th>길이</th><th>카테고리</th><th>제목</th><th class="num">최고 시청자</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <button id="more" type="button" hidden>더 보기</button>
      </section>
    </div>
  </main>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <script type="module" src="stats.js"></script>
</body>
</html>
